# `reference_band_rows` requires `property_band_modes` to select one mode for
# every property in `property_metric_map`. There is no default fallback.
# Every generated item should also resolve to a validation-design review status
# through
# either:
# - [validation_design_review].default_status
# - rule-level validation_design_review_status
# - property_validation_design_review_statuses for reference-band properties
#
# Supported band modes:
# - symmetric_sd: arithmetic mean +/- sigma * standard deviation
# - lognormal_sd: reconstruct a positive-only band in log space from the
#   uploaded arithmetic mean and standard deviation
# - beta_sd: reconstruct a bounded probability/fraction interval on [0, 1]
#   from the uploaded arithmetic mean and standard deviation
# - binary_indicator: treat the uploaded row as an exact binary class label
#   rather than as a continuous dispersion metric
# - quantile_interval: use explicitly reported row quantiles such as
#   q_low/q_high instead of reconstructing a band from mean and standard deviation
#
# Use lower and upper bounds for naturally constrained metrics:
# - non-negative metrics: lower bound 0.0
# - probabilities / proportions: lower bound 0.0 and upper bound 1.0
# This avoids impossible intervals such as negative ISI coefficients of variation.
#
# Every generated report will show both:
# - accepted_interval_mode
# - accepted_interval_standard
# so the statistical assumption stays visible to the reader.

