# Optional suite rollup override for contiguous grouped curve checks:
# suite_aggregate_policy = { norm_rollup = "mean" }
# The maintained series-comparison suite also supports:
# suite_aggregate_policy = { norm_rollup = "weighted_mean" }
# which currently uses matched-point count as the per-case aggregate weight.
# For slightly unaligned extracted/model x bins:
# alignment_policy = "nearest_within_tolerance"
