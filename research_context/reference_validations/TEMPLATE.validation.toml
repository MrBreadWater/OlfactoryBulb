# Scalar SciUnit-backed rule families (`all_*`, `group_*`, `summary_metric_*`)
# infer a typed metric quantity from `metric_key` when the suffix is
# informative, for example `_mV`, `_ms`, `_pA`, `_pF`, `_MOhm`, `_Hz`, or
# `_um`. Use `metric_unit_text` / `metric_quantity_name` only when the metric
# key is ambiguous or the displayed scientific name should be refined.

