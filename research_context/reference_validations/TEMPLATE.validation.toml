# For pooled shared x-clusters rather than one-to-one matching:
# alignment_policy = "tolerance_clusters"
# x_match_tolerance = 0.5
# For interpolation onto a shared comparison grid:
# alignment_policy = "resampled_grid"
# Optional ergonomic default:
